name: Build 32-bit OS for v86

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for 32-bit emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs container
        run: |
          docker build --platform linux/386 -t r-os-32 .
          CONTAINER_ID=$(docker create --platform linux/386 r-os-32)
          mkdir -p output/iso_root output/artifacts
          docker export $CONTAINER_ID | tar -x -C output/iso_root
          sudo chmod -R a+rX output/iso_root

      - name: Install ISO generation tools
        run: sudo apt-get update && sudo apt-get install -y xorriso isolinux syslinux-common

      - name: Build Bootable ISO
        run: |
          sudo mkdir -p output/iso_root/boot/isolinux
          sudo cp /usr/lib/ISOLINUX/isolinux.bin output/iso_root/boot/isolinux/
          sudo cp /usr/lib/syslinux/modules/bios/ldlinux.c32 output/iso_root/boot/isolinux/ || true

          # Create isolinux boot configuration
          sudo bash -c 'cat << "EOF" > output/iso_root/boot/isolinux/isolinux.cfg
          DEFAULT alpine
          LABEL alpine
            KERNEL /boot/vmlinuz-lts
            INITRD /boot/initramfs-lts
            APPEND root=/dev/sr0 console=tty0 console=ttyS0,115200
          EOF'

          sudo xorriso -as mkisofs \
            -o output/artifacts/r-os-32bit.iso \
            -b boot/isolinux/isolinux.bin \
            -c boot/isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            output/iso_root

      - name: Upload Bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: r-os-32bit-iso
          path: output/artifacts/r-os-32bit.iso
